name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-for-build-only
          NEXT_PUBLIC_API_URL: http://localhost:3001
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test-anon-key-for-build-only
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-for-build-only
          FRONTEND_ORIGIN: http://localhost:3000
